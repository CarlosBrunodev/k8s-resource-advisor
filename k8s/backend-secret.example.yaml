# EXEMPLO. Não aplique com estes valores. Crie o Secret fora do repositório, por exemplo:
#   kubectl -n resource-advisor create secret generic resource-advisor-prometheus \
#     --from-literal=bearer-token="$TOKEN"
# Use apenas as chaves necessárias: bearer-token OU username/password.
apiVersion: v1
kind: Secret
metadata:
  name: resource-advisor-prometheus
type: Opaque
stringData:
  bearer-token: "<token-do-prometheus>"
  # username: "<usuario>"
  # password: "<senha>"
