# EXEMPLO. Não aplique com estes valores. Crie o Secret fora do repositório, por exemplo:
#   kubectl -n resource-advisor create secret generic resource-advisor-prometheus \
#     --from-literal=bearer-token="$TOKEN"
# Use apenas as chaves necessárias: bearer-token OU username/password.
apiVersion: v1
kind: Secret
metadata:
  name: resource-advisor-prometheus
type: Opaque
stringData:
  bearer-token: "<token-do-prometheus>"
  # username: "<usuario>"
  # password: "<senha>"
---
# Token da página de administração (edição da fórmula). Crie fora do repositório:
#   kubectl -n resource-advisor create secret generic resource-advisor-admin --from-literal=token="$ADMIN_TOKEN"
apiVersion: v1
kind: Secret
metadata:
  name: resource-advisor-admin
type: Opaque
stringData:
  token: "<token-do-administrador>"
