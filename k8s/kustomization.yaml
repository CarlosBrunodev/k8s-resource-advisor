# Aplicação: kubectl apply -k k8s/  (namespace de destino definido pelo -n ou pelo contexto)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: resource-advisor
resources:
  - formula-pvc.yaml
  - rbac.yaml
  - backend.yaml
  - frontend.yaml
images:
  - name: resource-advisor-backend
    newName: carlosbrunodev/k8s-resource-advisor-api
    newTag: 2.1.0
  - name: resource-advisor-frontend
    newName: carlosbrunodev/k8s-resource-advisor-frt
    newTag: 2.1.0
labels:
  - pairs:
      app.kubernetes.io/part-of: resource-advisor
    includeSelectors: false
